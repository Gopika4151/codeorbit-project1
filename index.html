<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeOrbit AI Chatbot</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="chat-container">

        <div class="header">
            <div class="avatar">AI</div>
            <div>
                <h2>CodeOrbit Chatbot</h2>
                <p>● Online Assistant</p>
            </div>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="bot-message">
                Hello! Welcome to CodeOrbit AI Chatbot.
                How can I help you?
            </div>
        </div>

        <div class="suggestions">
            <button onclick="sendSuggestion('Hello')">Hello</button>
            <button onclick="sendSuggestion('How are you?')">How are you?</button>
            <button onclick="sendSuggestion('Help')">Help</button>
        </div>

        <div class="input-area">
            <input type="text" id="userInput"
                placeholder="Type your message...">

            <button onclick="sendMessage()">➤</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
